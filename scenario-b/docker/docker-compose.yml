services:
  app:
    build:
      # Context is scenario-b/ because the Dockerfile does "COPY app/ ./".
      context: ..
      dockerfile: docker/Dockerfile
    image: notes-api:latest
    container_name: badhon-notes-api
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8080}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      # "postgres" is the service name below. Inside the compose network that is the hostname.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-notes}
      DB_USERNAME: ${POSTGRES_USER:-notes}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-notes}
      # Number of PHP worker processes. Needs --no-reload in the Dockerfile CMD.
      PHP_CLI_SERVER_WORKERS: 20
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    ports:
      - "5151:8080"
    depends_on:
      - postgres
        # condition: service_healthy

  postgres:
    image: postgres:16
    container_name: badhon-notes-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-notes}
      POSTGRES_USER: ${POSTGRES_USER:-notes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notes}
    # Not published to the internet. Only the app container talks to it.
    expose:
      - "5432"
    volumes:
      - notes-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-notes} -d ${POSTGRES_DB:-notes}"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: badhon-notes-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "5252:9090"

  grafana:
    image: grafana/grafana:11.3.1
    container_name: badhon-notes-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # No sign-up page. Only the admin user above can log in.
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # This file tells Grafana to use Prometheus as the data source.
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "5353:3000"
    depends_on:
      - prometheus

volumes:
  notes-db-data:
  prometheus-data:
  grafana-data:
